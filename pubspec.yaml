name: hafatra
description: "Hafatra — messagerie hors-ligne multi-transport pour Madagascar."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # État et navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0

  # Persistance
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6

  # Identité et cryptographie
  flutter_secure_storage: ^11.2.0
  cryptography_plus: ^3.0.0

  # Mesh et Android
  bluetooth_low_energy: ^6.2.1
  flutter_foreground_task: ^11.0.3
  battery_plus: ^7.1.2
  flutter_local_notifications: ^22.3.2
  # 12.0.1 + override Android 13.0.1 : la 14.x exige compileSdk 37, dont le
  # dossier SDK installé est android-37.0 et n'est pas résolu par AGP 9.1.
  permission_handler: 12.0.1

  # Utilitaires
  uuid: ^4.6.0
  collection: ^1.19.1
  logging: ^1.3.0
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  very_good_analysis: ^11.0.0
  mocktail: ^1.0.5

# permission_handler_android 14.x compile contre SDK 37 ; le SDK installé
# expose android-37.0, que Gradle ne reconnaît pas comme android-37.
# On épingle l'implémentation Android 13.0.1 (compileSdk 35), compatible avec
# l'API Dart de permission_handler 12.0.1.
dependency_overrides:
  permission_handler_android: 13.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/trusted_authorities.json
    - assets/demo/demo_alert.json

  # Inter variable (axes wght + opsz) sous-ensemblée pour le français et le
  # malgache : 250 Ko, tous les poids depuis un seul fichier.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable-subset.ttf
